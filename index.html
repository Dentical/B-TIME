<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="pageTitle">B-Time — Официальный интернет-магазин часов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- СКРИПТ МОМЕНТАЛЬНОЙ ЗАГРУЗКИ НАСТРОЕК -->
    <script>
        (function() {
            const savedCfg = localStorage.getItem('btime_site_config');
            if (savedCfg) {
                try {
                    const cfg = JSON.parse(savedCfg);
                    document.documentElement.style.setProperty('--bg-color', cfg.bgColor || '#0b1329');
                    document.documentElement.style.setProperty('--text-color', cfg.textColor || '#f3f4f6');
                    document.documentElement.style.setProperty('--header-color', cfg.headerColor || '#0b1329');
                    document.documentElement.style.setProperty('--footer-color', cfg.footerColor || '#070d1d');
                    document.write('<style>body { background-color: ' + (cfg.bgColor || '#0b1329') + '; color: ' + (cfg.textColor || '#f3f4f6') + '; }</style>');
                } catch(e) {}
            }
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0b1329;
            --text-color: #f3f4f6;
            --header-color: rgba(11, 19, 41, 0.95);
            --footer-color: #070d1d;
            --topbar-color: #070d1d;
            --gold-gradient: linear-gradient(135deg, #ca8a04, #facc15);
            --accent-amber: #d97706;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
            padding-bottom: env(safe-area-inset-bottom);
        }

        .serif { font-family: 'Playfair Display', serif; }
        
        .top-bar { 
            background: var(--topbar-color); 
            border-bottom: 1px solid rgba(30, 58, 138, 0.5); 
            font-size: clamp(11px, 2.5vw, 12px); 
            color: #d1d5db; 
            padding: 8px 16px; 
        }
        .top-bar-inner { 
            max-width: 1280px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 8px; 
        }
        
        header { 
            position: sticky; 
            top: 0; 
            z-index: 40; 
            background: var(--header-color); 
            backdrop-filter: blur(10px); 
            border-bottom: 1px solid rgba(30, 58, 138, 0.6); 
            min-height: 60px; 
            display: flex; 
            align-items: center; 
            padding-top: env(safe-area-inset-top);
        }
        .header-inner { 
            max-width: 1280px; 
            margin: 0 auto; 
            width: 100%; 
            padding: 10px 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 12px; 
        }
        
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none; color: white; }
        .logo-icon { 
            width: 38px; 
            height: 38px; 
            border-radius: 12px; 
            background: var(--gold-gradient); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: black; 
            font-size: 16px; 
            flex-shrink: 0; 
        }
        
        nav { display: flex; gap: clamp(8px, 2vw, 16px); font-size: clamp(12px, 3vw, 14px); font-weight: 500; flex-wrap: wrap; }
        nav button { background: none; border: none; color: #e5e7eb; cursor: pointer; transition: color 0.2s; white-space: nowrap; }
        nav button:hover, nav button.active { color: #facc15; }

        .actions { display: flex; align-items: center; gap: 8px; }
        .btn-icon { 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid #1e3a8a; 
            color: #e5e7eb; 
            width: clamp(34px, 8vw, 38px); 
            height: clamp(34px, 8vw, 38px); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            position: relative; 
            transition: 0.2s; 
            flex-shrink: 0; 
        }
        .btn-icon:hover { border-color: #facc15; color: #facc15; }
        
        .badge { position: absolute; top: -4px; right: -4px; background: #eab308; color: black; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .main-content { flex-grow: 1; max-width: 1280px; margin: 0 auto; width: 100%; padding: clamp(12px, 3vw, 24px) 16px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .swiper-wrapper-container { position: relative; width: 100%; margin-bottom: 30px; }
        .horizontal-swiper {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 8px 4px 16px 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .horizontal-swiper::-webkit-scrollbar { display: none; }
        .horizontal-swiper .card { flex: 0 0 clamp(200px, 60vw, 250px); width: clamp(200px, 60vw, 250px); }

        .swiper-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .swiper-nav-btn:hover { background: #eab308; color: black; }
        .swiper-nav-left { left: -10px; }
        .swiper-nav-right { right: -10px; }

        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(160px, 45vw, 240px), 1fr)); gap: clamp(10px, 2vw, 20px); }
        
        .card { background: white; border-radius: 16px; overflow: hidden; color: #111827; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: relative; }
        .card-img-slider { position: relative; width: 100%; height: clamp(160px, 40vw, 200px); background: #f9fafb; overflow: hidden; }
        .card-img-track { display: flex; width: 100%; height: 100%; transition: transform 0.3s ease-in-out; }
        .card-img-track img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; }
        
        .card-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; z-index: 2; opacity: 0.8; transition: opacity 0.2s; }
        .card-arrow-left { left: 6px; }
        .card-arrow-right { right: 6px; }
        
        .card-dots { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; z-index: 2; }
        .card-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); transition: background 0.2s; }
        .card-dot.active { background: #eab308; width: 8px; border-radius: 4px; }

        .card-body { padding: clamp(10px, 2.5vw, 16px); display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        
        .btn-gold { background: var(--gold-gradient); color: black; font-weight: bold; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; width: 100%; transition: opacity 0.2s; font-size: 14px; }
        .btn-gold:hover { opacity: 0.9; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal.open { display: flex; }
        .modal-box { 
            background: white; 
            color: #111827; 
            width: 100%; 
            max-width: 550px; 
            border-radius: 24px; 
            padding: clamp(16px, 4vw, 24px); 
            position: relative; 
            max-height: 90dvh; 
            overflow-y: auto; 
        }
        .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; }
        
        form div { margin-bottom: 14px; }
        form label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
        form input, form textarea, form select { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; user-select: text; }
        
        footer { background: var(--footer-color); border-top: 1px solid rgba(30, 58, 138, 0.5); padding: 32px 16px; margin-top: 40px; color: #9ca3af; font-size: 13px; }
        .footer-inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
        
        .hidden { display: none !important; }
        .text-gold { color: #facc15; }
        .text-amber { color: #d97706; }

        @media (max-width: 768px) {
            .header-inner { flex-direction: column; align-items: stretch; gap: 10px; }
            nav { justify-content: center; }
            .actions { justify-content: flex-end; }
            .swiper-nav-btn { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-inner">
            <div style="display: flex; gap: 16px; align-items: center;" id="topBarDynamicContacts">
                <span><i class="fa-solid fa-location-dot text-gold"></i> Душанбе</span>
                <span>
